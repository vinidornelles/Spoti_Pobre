<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Gênero - SpotiPobre</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>

<body>
    <header class="topo">
        <a href="/" class="logo">Spoti<span>Pobre</span></a>
        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/playlists/">Playlists</a>
            <a href="/albuns/">Álbuns</a>
            <a href="/artistas/">Artistas</a>
            <a href="/generos/">Gêneros</a>
            <a href="/">Usuários</a>
        </nav>
    </header>

    <div class="container">
        <h1>Alterar Gênero</h1>

        <form action="/generos/alterar" method="post">
            <input type="hidden" name="id" value="{{genero.id}}">

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" value="{{genero.nome}}" required>
            </div>

            <div class="botoes">
                <a href="/generos/" class="btn btn-voltar">Voltar</a>
                <button type="submit" class="btn btn-principal">Salvar Alterações</button>
            </div>
        </form>
    </div>
</body>

</html>
