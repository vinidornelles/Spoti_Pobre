<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Playlist - SpotiPobre</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>

<body>
    <header class="topo">
        <a href="/" class="logo">Spoti<span>Pobre</span></a>
        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/playlists/">Playlists</a>
            <a href="/albuns/">Álbuns</a>
            <a href="/artistas/">Artistas</a>
            <a href="/generos/">Gêneros</a>
            <a href="/">Usuários</a>
        </nav>
    </header>

    <div class="container">
        <h1>Nova Playlist</h1>

        <form action="/playlists/nova" method="post">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome da playlist" required>
            </div>

            <div class="campo">
                <label for="usuario_id">Usuário (dono da playlist)</label>
                <select id="usuario_id" name="usuario_id" required>
                    {{#vetUsuario}}
                    <option value="{{id}}">{{nome}}</option>
                    {{/vetUsuario}}
                </select>
            </div>

            <div class="campo campo-check">
                <input type="checkbox" id="publica" name="publica" value="true" checked>
                <label for="publica">Playlist pública (desmarque para deixar privada)</label>
            </div>

            <div class="botoes">
                <a href="/playlists/" class="btn btn-voltar">Voltar</a>
                <button type="submit" class="btn btn-principal">Criar Playlist</button>
            </div>
        </form>
    </div>
</body>

</html>
